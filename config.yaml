# BetterCode 配置文件 - LLM 供应商管理
providers:
  - name: deepseek-v4
    protocol: openai
    model: deepseek-v4-flash
    context_window: 128000
    base_url: https://api.deepseek.com
    api_key: ${DEEPSEEK_API_KEY}
    default: true

  - name: claude-sonnet
    protocol: anthropic
    model: claude-sonnet-5-20251001
    context_window: 200000
    base_url: https://api.anthropic.com
    api_key: ${ANTHROPIC_API_KEY}
    thinking: false

  - name: gpt-4o
    protocol: openai
    model: gpt-4o
    context_window: 128000
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}

# Worktree 隔离可选配置，未声明时使用相同默认值。
worktrees:
  retention_days: 7
  cleanup_interval_ms: 3600000

# cc-switch 桌面版适配：启用后自动读取 ~/.claude/settings.json 的 env 块，
# 把当前激活的 Claude 供应商导入为默认 Provider。改动后需重启 BetterCode。
